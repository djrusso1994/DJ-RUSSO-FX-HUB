name: Refresh showcase GIF (v0.8.45 only)

on:
  push:
    branches:
      - release/v0.8.45-stereo-x
    paths:
      - '.github/workflows/refresh-showcase-0845.yml'

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image library
        run: python -m pip install Pillow==11.3.0
      - name: Append the original STEREO X screenshots
        run: python scripts/refresh-showcase-0845.py
      - name: Commit only the updated showcase
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/suite-showcase.gif
          git commit -m "Update showcase with two STEREO X v1.2.0 views"
          git push origin HEAD:refs/heads/release/v0.8.45-stereo-x
