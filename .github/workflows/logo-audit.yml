name: Temporary logo asset audit
on:
  push:
    branches:
      - fix/v0.8.38-restore-planned-logo-assets
    paths:
      - 'tools/logo-audit/repair.py'
jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.1.0
      - run: python tools/logo-audit/repair.py
      - name: Commit repaired PNGs and visual verification
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Assets/*.png .logo-audit/contact-after.b64 .logo-audit/cleanup-report.json
          git commit -m "Temporary logo asset audit report" || exit 0
          git push origin HEAD:fix/v0.8.38-restore-planned-logo-assets
