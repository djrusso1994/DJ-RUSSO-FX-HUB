name: FX HUB - Showcase GIF only

on:
  push:
    branches: ['release/v0.8.46-auto-master-x']
    paths:
      - 'tools/build-suite-showcase.py'
      - '.github/workflows/showcase-auto-master.yml'

concurrency:
  group: auto-master-showcase-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  showcase:
    name: Generate the v0.8.46 suite showcase
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/v0.8.46-auto-master-x' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify ten-frame GIF
        run: |
          python -m pip install Pillow==11.3.0
          python tools/build-suite-showcase.py
      - name: Upload showcase artifact
        uses: actions/upload-artifact@v6
        with:
          name: suite-showcase-v0.8.46-10slides
          path: screenshots/suite-showcase-v0.8.46-10slides.gif
          if-no-files-found: error
      - name: Commit only the verified showcase and its README reference
        shell: bash
        run: |
          test "$(git branch --show-current)" = "release/v0.8.46-auto-master-x"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- screenshots/suite-showcase-v0.8.46-10slides.gif README.md
          if ! git diff --cached --quiet; then
            git commit -m "Correct suite showcase counters and progress to 10 slides"
            git push origin HEAD:refs/heads/release/v0.8.46-auto-master-x
          fi
