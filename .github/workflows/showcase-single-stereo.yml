name: Refresh showcase single STEREO X
on:
  push:
    branches: [docs/showcase-single-stereo-0845]
    paths: ['.github/workflows/showcase-single-stereo.yml']
permissions:
  contents: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/showcase-single-stereo.py
      - name: Commit verified GIF and clean up temporary generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add screenshots/suite-showcase-v0.8.45.gif
          git rm scripts/showcase-single-stereo.py
          git commit -m "Keep only Vectorscope in animated showcase (9 slides)"
          git push origin HEAD:refs/heads/docs/showcase-single-stereo-0845
