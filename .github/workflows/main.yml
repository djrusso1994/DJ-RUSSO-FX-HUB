name: DJ RUSSO FX HUB - Windows Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the tested installer publicly after approval'
        type: boolean
        required: true
        default: false
  pull_request:
    branches: [main]
  push:
    branches: [main, 'release/v0.8.46-auto-master-x']
    paths:
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.csproj'
      - '**/*.sln'
      - '**/*.slnx'
      - '.github/workflows/main.yml'
      - 'installer/**'
      - 'ChipMusic/**'
      - 'Assets/**'
      - 'Payload/**'
      - 'plugins.json'
      - 'effect-packages.json'
      - 'plugin-updates.json'
      - 'tools/build-suite-showcase.py'

# Cancel older builds on the same branch when a new commit arrives.
# Manual runs are kept separate from branch push runs.
concurrency:
  group: fx-hub-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  showcase:
    name: Generate the v0.8.46 suite showcase
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/release/v0.8.46-auto-master-x' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and verify ten-frame GIF
        run: |
          python -m pip install Pillow==11.3.0
          python tools/build-suite-showcase.py
      - name: Upload showcase artifact
        uses: actions/upload-artifact@v6
        with:
          name: suite-showcase-v0.8.46-10slides
          path: screenshots/suite-showcase-v0.8.46-10slides.gif
          if-no-files-found: error
      - name: Commit only the verified showcase and its README reference
        shell: bash
        run: |
          test "$(git branch --show-current)" = "release/v0.8.46-auto-master-x"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- screenshots/suite-showcase-v0.8.46-10slides.gif README.md
          if ! git diff --cached --quiet; then
            git commit -m "Correct suite showcase counters and progress to 10 slides"
            git push origin HEAD:refs/heads/release/v0.8.46-auto-master-x
          fi

  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Find and publish FX HUB
        shell: pwsh
        run: |
          $project = Get-ChildItem -Path . -Recurse -Filter DJRussoFXHub.csproj | Select-Object -First 1
          if (-not $project) { throw "DJRussoFXHub.csproj not found. Upload the project source files first." }
          dotnet publish $project.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableWindowsTargeting=true -o "$env:GITHUB_WORKSPACE/publish"
          if ($LASTEXITCODE -ne 0) { throw "Publish failed." }

      - name: Verify bundled plugin payloads
        shell: pwsh
        run: |
          $meter = "publish/Payload/DJ RUSSO METER X.exe"
          $shell = "publish/Payload/DJ RUSSO FX SHELL.vst3"
          if (-not (Test-Path -LiteralPath $meter -PathType Leaf)) { throw "METER X executable missing from publish output." }
          if (-not (Test-Path -LiteralPath $shell -PathType Leaf)) { throw "FX SHELL VST3 missing from publish output." }
          $reverb = "publish/Payload/DJ RUSSO REVERB X.vst3"
          if (-not (Test-Path -LiteralPath $reverb -PathType Leaf)) { throw "REVERB X v1.3 payload missing; do not publish incomplete HUB." }
          $expected = "1e74946b3ea145bc9959f3d198f581361c9597d4efbe84869d02684bdf84b017"
          $actual = (Get-FileHash -LiteralPath $reverb -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "REVERB X payload SHA-256 mismatch; refusing release." }
          $delay = "publish/Payload/DJ RUSSO DELAY X.vst3"
          if (-not (Test-Path -LiteralPath $delay -PathType Leaf)) { throw "DELAY X v1.3 payload missing; do not publish incomplete HUB." }
          if ((Get-FileHash -LiteralPath $delay -Algorithm SHA256).Hash.ToLowerInvariant() -ne "b442f60efb91dee6978af07ddb79f8f208b51107bc7775eec18d25d47f60b6d1") { throw "DELAY X payload SHA-256 mismatch; refusing release." }
          $compressor = "publish/Payload/DJ RUSSO COMPRESSOR X.vst3"
          if (-not (Test-Path -LiteralPath $compressor -PathType Leaf)) { throw "COMPRESSOR X v2.2 payload missing; do not publish incomplete HUB." }
          if ((Get-FileHash -LiteralPath $compressor -Algorithm SHA256).Hash.ToLowerInvariant() -ne "cad8e2d08a34060b1d2af958063b96836c4f3df706420048ffbc3d6cf660a504") { throw "COMPRESSOR X payload SHA-256 mismatch; refusing release." }
          if (-not (Test-Path -LiteralPath "Assets/logo-compressor-x.png" -PathType Leaf)) { throw "COMPRESSOR X approved logo missing." }
          if (-not (Test-Path -LiteralPath "Assets/eq-x.png" -PathType Leaf)) { throw "EQ X approved logo missing." }
          if (-not (Test-Path -LiteralPath "Assets/drive-x.png" -PathType Leaf)) { throw "DRIVE X approved logo missing." }
          if (-not (Test-Path -LiteralPath "Assets/stereo-x.png" -PathType Leaf)) { throw "STEREO X approved logo missing." }
          if (-not (Test-Path -LiteralPath "Assets/auto-master-x.png" -PathType Leaf)) { throw "AUTO MASTER X approved logo missing." }
          $catalog = Get-Content "publish/plugin-updates.json" -Raw | ConvertFrom-Json
          foreach ($package in $catalog.packages) {
            $p = Join-Path "publish/Payload" $package.download.fileName
            if (-not (Test-Path -LiteralPath $p -PathType Leaf)) { throw "Missing individual package: $p" }
            if ((Get-Item -LiteralPath $p).Length -ne $package.download.sizeBytes) { throw "Individual package size mismatch: $p" }
            if ((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant() -ne $package.download.sha256) { throw "Individual package hash mismatch: $p" }
          }
          Write-Host "All nine bundled packages and individual download metadata verified."

      - name: Verify individual downloads from pinned GitHub commits
        shell: pwsh
        run: |
          $catalog = Get-Content "publish/plugin-updates.json" -Raw | ConvertFrom-Json
          foreach ($package in $catalog.packages) {
            $d = $package.download
            $encoded = [Uri]::EscapeDataString($d.fileName)
            $url = "https://raw.githubusercontent.com/djrusso1994/DJ-RUSSO-FX-HUB/$($d.commit)/Payload/$encoded"
            $temp = Join-Path $env:RUNNER_TEMP ("plugin-check-" + [Guid]::NewGuid().ToString("N"))
            try {
              Invoke-WebRequest -Uri $url -OutFile $temp -MaximumRedirection 0 -TimeoutSec 90 -ErrorAction Stop
              if ((Get-Item -LiteralPath $temp).Length -ne $d.sizeBytes) { throw "Remote package size mismatch: $($package.id)" }
              if ((Get-FileHash -LiteralPath $temp -Algorithm SHA256).Hash.ToLowerInvariant() -ne $d.sha256) { throw "Remote package SHA-256 mismatch: $($package.id)" }
              Write-Host "Verified remote individual package: $($package.id)"
            } finally {
              Remove-Item -LiteralPath $temp -ErrorAction SilentlyContinue
            }
          }

      # Early smoke check for WPF resource/XAML parse failures before packaging or releasing.
      - name: Smoke-test FX HUB WPF startup
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "publish/DJRussoFXHub.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "FX HUB EXE missing." }
          $p = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            Start-Sleep -Seconds 8
            $p.Refresh()
            if ($p.HasExited) { throw "FX HUB exited during WPF startup (code $($p.ExitCode)); check XAML and exception logs." }
            Write-Host "WPF startup smoke test passed (process remained running)."
          }
          finally {
            $p.Refresh()
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup installation failed." }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\\Inno Setup 6\\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "installer\\DJ_RUSSO_FX_HUB.iss"
          if ($LASTEXITCODE -ne 0) { throw "Installer compilation failed." }
          if (-not (Test-Path "installer-output\\DJ_RUSSO_FX_HUB_Setup_v0.8.46.exe")) { throw "Installer output missing." }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: DJ_RUSSO_FX_HUB_Setup_v0.8.46
          path: installer-output/DJ_RUSSO_FX_HUB_Setup_v0.8.46.exe
          if-no-files-found: error

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath DJ_RUSSO_FX_HUB_Windows_x64.zip -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: DJ_RUSSO_FX_HUB_Windows_x64
          path: DJ_RUSSO_FX_HUB_Windows_x64.zip

  release:
    name: Publish approved public release
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5

      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*<Version>\([^<]*\)<\/Version>.*/\1/p' DJRussoFXHub.csproj | head -n 1)
          test -n "$VERSION" || { echo "Project version missing"; exit 1; }
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate manual release approval
        id: policy
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "Publishing approved stable release from main or manual dispatch, for v$VERSION"

      - name: Download tested installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p release-assets
          gh run download "$RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "DJ_RUSSO_FX_HUB_Setup_v$VERSION" \
            --dir release-assets

      - name: Verify installer before publishing
        shell: bash
        run: |
          test -s "release-assets/DJ_RUSSO_FX_HUB_Setup_v${{ steps.version.outputs.value }}.exe"

      - name: Publish new GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged."
            exit 0
          fi
          EXTRA_ARGS=()
          EXTRA_ARGS+=(--latest)
          gh release create "$TAG" "release-assets/DJ_RUSSO_FX_HUB_Setup_v$VERSION.exe" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DJ RUSSO FX HUB $TAG - Neon Ghost" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
